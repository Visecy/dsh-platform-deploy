- id: webserver
  disabled: true
- id: subprocess
  disabled: true
- id: fs-sandbox
  disabled: true
- insert:
    - id: webserver-gated
      name: 'dsh-web-auth'
      inject: [webStartup]
      config:
        host: '0.0.0.0'
        port: !!js ctx.webStartup.port ?? 3080
    - id: dsh-auth-oidc
      name: '@visecy/dsh-auth-oidc'
      config:
        oidc:
          issuer: !!js process.env.OIDC_ISSUER
          clientId: !!js process.env.OIDC_CLIENT_ID
          clientSecret: !!js process.env.OIDC_CLIENT_SECRET
          redirectUri: !!js process.env.OIDC_REDIRECT_URI
          scopes: [openid, profile, email, groups]
        sessionSecret: !!js process.env.SESSION_SECRET
        adminGroups: !!js (process.env.ADMIN_GROUPS ?? 'dsh-admins').split(',')
    - id: workspace-runtime
      name: '@visecy/dsh-workspace-k8s'
      config:
        namespace: !!js process.env.WS_NAMESPACE ?? 'dsh-platform'
        image: !!js process.env.WS_IMAGE ?? 'ghcr.io/visecy/dsh-sandbox-daemon:0.1.0'
        daemonPort: 4390
        storageClassName: !!js process.env.WS_STORAGE_CLASS ?? 'local-path'
        storageSize: '2Gi'
    - id: fs-k8s
      name: '@visecy/dsh-fs-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://dsh-ws0-svc.dsh-platform.svc.cluster.local:4390')
        hostRoot: '/workspaces'
        podRoot: '/workspace'
    - id: subprocess-k8s
      name: '@visecy/dsh-subprocess-k8s'
      config:
        daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://dsh-ws0-svc.dsh-platform.svc.cluster.local:4390')
