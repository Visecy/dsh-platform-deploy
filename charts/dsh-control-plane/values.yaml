# dsh-control-plane values
replicaCount: 1

image:
  dshWeb: ghcr.io/visecy/dsh-web-platform:latest
  pullPolicy: IfNotPresent

# dsh web listen (public; in-process OIDC gate via dsh-web-auth fork)
dshWeb:
  port: 3080
  # public authority(ies) the /api trust fence accepts (--trusted-host)
  trustedHosts: []

auth:
  oidcIssuer: ""
  oidcClientId: ""
  redirectUri: ""
  adminGroups: "dsh-admins"
  # secret refs
  oidcClientSecretRef: ""
  sessionSecretRef: ""

# workspace execution pods (sandbox daemon)
workspace:
  image: ghcr.io/visecy/dsh-platform/dsh-sandbox-daemon:v0.1.19
  daemonPort: 4390
  storageClassName: "local-path"
  storageSize: "2Gi"

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Istio exposure via an internal gateway
istio:
  enabled: false
  gateway: istio-system/internal-gateway
  host: ""
