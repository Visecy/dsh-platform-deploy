# dsh-control-plane values
replicaCount: 1

image:
  # Pin the platform tag: `latest` is a moving target whose profile may not match
  # this chart's expectations, and the workspace daemon image must come from the
  # SAME tag (see workspace.image). Bump both together on every release.
  #
  # This chart passes `dsh web --public-url`, which needs a platform image on the
  # DSH 0.2.1 line (v0.1.92+; v0.1.89/v0.1.90 miss the subprocess terminal
  # seam, and v0.1.91 can stick in waking; v0.1.92 fixes both). Do not pair it
  # with an older image: that CLI does not know the flag.
  dshWeb: ghcr.io/visecy/dsh-web-platform:v0.1.92
  pullPolicy: IfNotPresent

# dsh web listen. This chart starts the process with `--host 127.0.0.1`, points
# no Service at it, and gives its port a same-label-pod rule in the
# NetworkPolicy, so the DSH process is reachable only through the oauth2-proxy
# sidecar in the same pod -- that is what makes the identity headers structural
# rather than policy-based.
#
# The loopback bind comes from the platform image's profile, not from this
# chart's flag alone. Every published image since the zero-patch rewrite binds
# 127.0.0.1 and does the OIDC gate in the sidecar; a pre-rewrite image (the old
# `webserver-gated` fork row) would also listen on the pod IP, where the
# NetworkPolicy is the only barrier. Do not run such an image: pin the tag above.
dshWeb:
  port: 3080
  # public authority(ies) forwarded to dsh web as --trusted-host. DSH 0.1.2
  # gates EVERY /api request / RPC channel / WebSocket on this list (Host /
  # Origin fence of dsh-client-connection), so deployments that publish the
  # GUI through a hostname MUST set it (e.g. dsh.<domain>) or the browser UI
  # gets 403 on every /api call. The original Host reaches dsh web unchanged
  # because the sidecar runs with --pass-host-header=true.
  trustedHosts: []

# OIDC settings. These feed the oauth2-proxy SIDECAR (args + OAUTH2_PROXY_*
# env), NOT the dsh web container: the app reads no OIDC_* / ADMIN_GROUPS /
# SESSION_SECRET variable any more and receives the verified identity only as
# X-Forwarded-User/-Groups. Secret refs point at existing Secrets; keep the
# values out of the release.
auth:
  oidcIssuer: ""
  oidcClientId: ""
  # Public redirect URI. Only its ORIGIN is consumed: with
  # oauth2Proxy.redirectUrl empty the chart derives
  # <origin>/oauth2/callback for the sidecar, and the origin is also a
  # fallback source for oauth2Proxy.publicOrigin. The path part is
  # documentation, not a route this app serves -- register
  # <origin>/oauth2/callback at the IdP (see config/authentik.example.md).
  redirectUri: ""
  # secret refs
  # client secret for the sidecar (key: oidc-client-secret)
  oidcClientSecretRef: ""
  # session-secret (key: session-secret); used as the sidecar cookie secret
  # only when oauth2Proxy.cookieSecretRef is empty, and it must then decode to
  # exactly 16/24/32 bytes
  sessionSecretRef: ""

# oauth2-proxy sidecar: terminates the user session in an encrypted cookie
# (stateless -- no Redis, no DB, no volume) and reverse-proxies to the dsh web
# container, adding the verified identity as request headers.
#
# IDENTITY CONTRACT: X-Forwarded-User / X-Forwarded-Groups (--pass-user-headers)
# are the trusted upstream pair; X-Auth-Request-* is client-controllable in this
# topology and MUST never be read as identity. The chart therefore does NOT set
# --set-xauthrequest: it would only add that family to the browser response and
# advertise it as trustworthy. If a future component ever does need to consume
# X-Auth-Request-*, strip it at the ingress -- the chart cannot remove it here.
# See templates/deployment.yaml and docs/deployment.md.
#
# It is the pod's only published entry point; read the ordering note above
# before relying on dsh web being loopback-only.
oauth2Proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy
  # pinned; the sidecar's own image runs as uid 65532 (distroless, non-root)
  tag: v7.15.5
  # container port; the Service exposes this one and nothing else
  port: 4180
  resources: {}
  # OIDC scopes requested at the IdP. `groups` must stay: without it the
  # groups claim is absent and identity-bridge's X-Forwarded-Groups (the
  # principal's groups, exposed via ctx.dshAuth) carries nothing.
  scope: "openid email profile groups"
  # OIDC claim that carries the user's groups.
  groupsClaim: groups
  # Public root browsers use: scheme://host[/<prefix>], NO trailing slash (e.g.
  # https://dsh.example.com, or https://dsh.example.com/dsh). The chart passes
  # it to `dsh web` as `--public-url`; the app then advertises it through the
  # official `webApp.getAdvertisedUrl()`, which identity-bridge uses as the base
  # of the launch-token handoff redirect (and DSH_WEB_URL uses for the runtime
  # context).
  #
  # A path switches on SUBPATH PUBLISHING (v1: exactly one path segment, e.g.
  # /dsh). Everything is derived from this one value -- the ingress
  # prefix-strip regex (or the Istio prefix match + rewrite), the / and /<prefix>
  # 301 Ingress/VirtualService route, the oauth2-proxy callback URL, and the
  # sidecar cookie path. The render fails fast when that cannot work: no routing
  # layer enabled, ingress.className not nginx, user annotations that already set
  # rewrite-target/use-regex, or an explicit redirectUrl outside the prefix.
  # See docs/deployment.md §4.4 and SECURITY.md for the limitations (one DSH
  # instance per host; single-segment prefix only).
  #
  # Leave empty to derive an ORIGIN from, in order, the origin of redirectUrl,
  # the origin of auth.redirectUri, https://<ingress.host> (when
  # ingress.enabled), https://<istio.host> (when istio.enabled). Those derived
  # sources are origins only: subpath publishing must set publicOrigin
  # explicitly. If no root is derivable the chart FAILS to render on purpose:
  # with no pinned root the handoff would derive it from the request's
  # X-Forwarded-Proto/Host, which a client can influence unless trustedProxyIps
  # is set (see below).
  publicOrigin: ""
  # Redirect URL registered at the IdP. oauth2-proxy's callback path is
  # /oauth2/callback -- NOT auth.redirectUri's path, which is never served.
  # Leave empty to derive it: in root publishing
  # <auth.redirectUri origin>/oauth2/callback, in subpath publishing
  # <publicRoot>/oauth2/callback (e.g.
  # https://dsh.example.com/dsh/oauth2/callback, because the ingress/gateway
  # strips the prefix again before the sidecar). An explicit value must stay
  # under the mount prefix when a prefix is configured, or the render fails: a
  # callback registered at the host root would 404 / loop.
  redirectUrl: ""
  # Secret name/key holding the cookie signing+encryption key. An empty name
  # reuses auth.sessionSecretRef. The value MUST be exactly 16, 24 or 32
  # bytes (raw, or base64url of one of those), e.g.
  # python3 -c 'import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
  cookieSecretRef: ""
  cookieSecretKey: session-secret
  # The sidecar session cookie's Path is derived from publicOrigin, not a
  # separate value: "/" in root publishing (the oauth2-proxy default -- no
  # --cookie-path flag is rendered, so the output is unchanged) and "/<prefix>/"
  # in subpath publishing (rendered as --cookie-path=/<prefix>/). It is
  # deliberately not exposed as a knob: it must always agree with the mount
  # prefix, or the browser stops sending the session cookie to the right paths.
  # Source CIDRs allowed to set X-Forwarded-* for this proxy, mapped to
  # `--trusted-proxy-ip` (repeat the --set for every hop that may add or
  # rewrite X-Forwarded-*).
  #
  # REQUIRED FOR PRODUCTION: set it to the ingress/gateway Pod CIDR. Empty
  # means oauth2-proxy's back-compat "trust every peer" mode, which logs
  #   WARNING: --reverse-proxy is enabled but no --trusted-proxy-ip CIDRs were
  #   configured. All connecting IPs are trusted to supply X-Forwarded-*
  #   headers by default (0.0.0.0/0, ::/0)
  # and lets any client pick X-Forwarded-Proto/Host/For.
  #
  # What degrades when it is empty -- NOT an authentication bypass (the
  # session cookie still gates access): every per-request decision the proxy
  # derives from those headers becomes client-influenced -- the redirect it
  # builds for /oauth2/*, cookie-flag decisions, and client-IP logging -- and
  # any future component that reads X-Forwarded-* inherits that trust. Pinning
  # oauth2Proxy.publicOrigin keeps the APP's launch-token handoff redirect off
  # those headers; it does not make trusting every peer correct.
  #
  # Keep it configuration: the CIDR is deployment-specific and is never
  # hardcoded in this chart.
  trustedProxyIps: []
  # Extra `--flag=value` args appended verbatim (escape hatch).
  extraArgs: []

# workspace execution pods (sandbox daemon)
workspace:
  # MUST be the daemon image built from the SAME platform tag as the control
  # plane: the two sides share the daemon wire protocol and there is no version
  # handshake. Bump this together with image.dshWeb on every release.
  image: ghcr.io/visecy/dsh-platform/dsh-sandbox-daemon:v0.1.92
  daemonPort: 4390
  # StorageClass for the per-workspace PVC. Empty string = the cluster's default
  # class. The platform's image default is `local-path`, which only exists on
  # clusters that ship the local-path provisioner -- set this explicitly on any
  # other cluster, or every PVC stays Pending and workspaces never start.
  storageClassName: "local-path"
  storageSize: "2Gi"
  # Isolation escalation: "" (runc) -> gvisor -> kata. Requires the RuntimeClass
  # to exist on the cluster.
  runtimeClassName: ""
  # Idle sleep / lingering-command grace / reconcile + metrics intervals.
  # QUOTED ON PURPOSE: Helm renders a bare YAML number with Go's %v, which
  # switches to scientific notation at 1e6 -- `graceMs: 10800000` reached the
  # container as "1.08e+07" on a live install. JavaScript's Number() happens to
  # parse that, but the env var must read as the digit string it is.
  idleTimeoutMs: "300000"
  graceMs: "10800000"
  reconcileIntervalMs: "60000"
  metricIntervalMs: "15000"
  # Workspace pod requests = limits.
  cpu: "2"
  memory: "2Gi"
  # Fence the unauthenticated sandbox daemon (port 4390, files/commands/pty) to
  # the control plane with a per-workspace NetworkPolicy.
  #
  # OFF BY DEFAULT on purpose: it only takes effect on a CNI that enforces
  # NetworkPolicy, and the peer is a pod selector -- get it wrong and every
  # workspace becomes unreachable. Turn it on in any cluster where other tenants
  # can schedule pods: without it, ANY pod that can reach the workspace pod can
  # read and write its files and run commands in it.
  networkPolicy:
    enabled: false
    # Pod labels of the control plane; must match the pods that call the daemon
    # (this chart renders app.kubernetes.io/name=dsh-control-plane).
    controlPlanePodLabels:
      app.kubernetes.io/name: dsh-control-plane

# Secret holding the PostgreSQL connection string (key:
# DSH_PG_CONNECTION_STRING). REQUIRED: the shipped profile reads it through
# `secretKeyRef` with no default, and PostgreSQL is the only backend the image
# offers. Create it before the first install -- see docs/deployment.md.
db:
  connectionStringSecret: dsh-db

# imagePullSecrets for BOTH containers. Empty by default: the published images
# are public, so a fresh cluster needs nothing here. Set it when you mirror the
# images into a private registry, e.g.
#   imagePullSecrets:
#     - name: my-registry-pull
imagePullSecrets: []

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
  # Extra annotations for this Ingress. Values are strings: pass numbers with
  # --set-string (the template quotes every value, so a stray `--set ...=3600`
  # no longer produces an object the API server rejects).
  # nginx-ingress buffers proxied
  # responses and times out idle streams, which silently breaks the SSE
  # stream (/plugins/events) and the WebSocket (/api/remote.mux):
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # Istio/Envoy (virtualservice.yaml) streams by default and needs none.
  #
  # ROOT PUBLISHING (no path in oauth2Proxy.publicOrigin) renders exactly the
  # same single Ingress as before: one path "/" with pathType Prefix and no
  # rewrite annotations.
  #
  # SUBPATH PUBLISHING derives the routes from the public root's path and adds:
  #   * on this Ingress: nginx.ingress.kubernetes.io/use-regex "true" and
  #     rewrite-target "/$2", path "<prefix>(/|$)(.*)" with pathType
  #     ImplementationSpecific -- the prefix is stripped before the sidecar
  #     (the DSH token exchange only accepts path "/");
  #   * a second Ingress "<fullname>-redirect" with pathType Exact paths "/" and
  #     "<prefix>", annotated nginx.ingress.kubernetes.io/permanent-redirect to
  #     "<publicRoot>/" (301). The trailing-slash entry point is required: bare
  #     /<prefix> would resolve the app's relative assets against the host root,
  #     and oauth2-proxy can bounce its post-login redirect to "/".
  # The streaming annotations above are merged into the prefix-mode Ingress
  # unchanged. Prefix routing with an Ingress requires ingress.className=nginx
  # (the render fails otherwise); on Istio use istio.enabled instead.
  annotations: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Istio exposure via an internal gateway.
# Root publishing (no path in oauth2Proxy.publicOrigin) renders the same
# catch-all route as before. Subpath publishing renders, in this order:
#   1. match uri.prefix "<prefix>/" + rewrite uri "/" -> the prefix is stripped
#      before the sidecar (the DSH token exchange only accepts path "/");
#   2. exact-match "/" and "<prefix>" -> redirectCode 301 to "<prefix>/".
#      The redirect target is a path, not the absolute root: Istio maps it to
#      Envoy's path_redirect, which builds <request scheme>://<request host><path>
#      -- an absolute URL there would be appended, not replaced. For the
#      supported single-host setup the result is <publicRoot>/.
# Subpath publishing needs exactly one routing layer that can strip the prefix:
# enable ingress (nginx) or istio, not neither.
istio:
  enabled: false
  gateway: istio-system/internal-gateway
  host: ""
