# dsh-control-plane values
replicaCount: 1

image:
  dshWeb: ghcr.io/visecy/dsh-web-platform:latest
  pullPolicy: IfNotPresent

# dsh web listen (public; in-process OIDC gate via dsh-web-auth fork)
dshWeb:
  port: 3080
  # public authority(ies) forwarded to dsh web as --trusted-host. DSH 0.1.2
  # gates EVERY /api request / RPC channel / WebSocket on this list (Host /
  # Origin fence of dsh-client-connection), so deployments that publish the
  # GUI through a hostname MUST set it (e.g. dsh.<domain>) or the browser UI
  # gets 403 on every /api call.
  trustedHosts: []

auth:
  oidcIssuer: ""
  oidcClientId: ""
  redirectUri: ""
  adminGroups: "dsh-admins"
  # secret refs
  oidcClientSecretRef: ""
  sessionSecretRef: ""

# workspace execution pods (sandbox daemon)
workspace:
  image: ghcr.io/visecy/dsh-platform/dsh-sandbox-daemon:v0.1.49
  daemonPort: 4390
  storageClassName: "local-path"
  storageSize: "2Gi"

# shared CNPG PostgreSQL connection secret injected into the control plane.
db:
  connectionStringSecret: dsh-db

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Istio exposure via an internal gateway
istio:
  enabled: false
  gateway: istio-system/internal-gateway
  host: ""
