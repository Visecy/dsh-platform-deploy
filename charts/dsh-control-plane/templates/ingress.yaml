{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  # annotations are map[string]string: quote every value so that a numeric
  # --set (e.g. proxy-read-timeout=3600, which helm parses as int64) cannot
  # render an unquoted number, which the API server rejects. --set-string in
  # docs/deployment.md is still the documented way to pass them.
  annotations:
    {{- range $key, $value := . }}
    {{ $key | quote }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ required "ingress.host required" $.Values.ingress.host }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host required" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # resolves to the oauth2-proxy sidecar port (service.yaml);
              # WebSocket/SSE tuning, if the class needs it, is in
              # ingress.annotations (nginx does, Istio/Envoy does not).
              service:
                name: {{ include "dsh-control-plane.fullname" . }}
                port:
                  name: http
{{- end }}
