apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
  ports:
    # The oauth2-proxy sidecar is the only exposed port. dsh web ({{ .Values.dshWeb.port }})
    # must never be a Service target -- reaching it directly would bypass
    # authentication entirely -- and the chart starts it with --host 127.0.0.1
    # for that reason (values.yaml pins the image whose profile binds loopback).
    - name: http
      port: {{ .Values.oauth2Proxy.port }}
      targetPort: http
