{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  gateways:
    - {{ .Values.istio.gateway }}
  hosts:
    - {{ required "istio.host required" .Values.istio.host }}
  http:
    - route:
        - destination:
            host: {{ include "dsh-control-plane.fullname" . }}
            port:
              # the Service front port = oauth2-proxy sidecar; dsh web itself
              # ({{ .Values.dshWeb.port }}) is not published by the Service and is started with
              # --host 127.0.0.1 (values.yaml records the ordering caveat).
              # Istio/Envoy streams responses by default and its route timeout is
              # disabled unless set, so the WebSocket and SSE endpoints need no
              # extra tuning here.
              number: {{ .Values.oauth2Proxy.port }}
{{- end }}
