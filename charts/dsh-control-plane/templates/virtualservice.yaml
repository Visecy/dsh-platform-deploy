{{- if .Values.istio.enabled }}
{{- $mountPrefix := include "dsh-control-plane.mountPrefix" . }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  gateways:
    - {{ .Values.istio.gateway }}
  hosts:
    - {{ required "istio.host required" .Values.istio.host }}
  http:
{{- if $mountPrefix }}
    # Subpath publishing. Route order matters: the prefix route strips the
    # prefix before the sidecar (the DSH token exchange only accepts path /),
    # the exact-match route that follows 301s / and /<prefix> to <root>/.
    #
    # The redirect target is the path only, not the absolute root: Istio maps
    # redirect.uri to Envoy's path_redirect, and Envoy builds the Location as
    # <request scheme>://<request host><path> (Http::Utility::newUri() in
    # source/common/http/utility.cc). An absolute URL here would therefore
    # render as "https://<host>/https://<host>/<prefix>/"; the path-only value
    # produces https://<request host>/<prefix>/ , which is <root>/ whenever the
    # public root host is the gateway host (the supported single-host setup).
    - match:
        - uri:
            prefix: {{ $mountPrefix }}/
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "dsh-control-plane.fullname" . }}
            port:
              number: {{ .Values.oauth2Proxy.port }}
    - match:
        - uri:
            exact: {{ $mountPrefix }}
        - uri:
            exact: /
      redirect:
        uri: {{ $mountPrefix }}/
        redirectCode: 301
{{- else }}
    - route:
        - destination:
            host: {{ include "dsh-control-plane.fullname" . }}
            port:
              # the Service front port = oauth2-proxy sidecar; dsh web itself
              # ({{ .Values.dshWeb.port }}) is not published by the Service and is started with
              # --host 127.0.0.1 (values.yaml records the ordering caveat).
              # Istio/Envoy streams responses by default and its route timeout is
              # disabled unless set, so the WebSocket and SSE endpoints need no
              # extra tuning here.
              number: {{ .Values.oauth2Proxy.port }}
{{- end }}
{{- end }}
