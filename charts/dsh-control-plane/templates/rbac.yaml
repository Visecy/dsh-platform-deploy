apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}-workspaces
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
rules:
  # workspace execution pods + headless services + PVCs, all in this namespace
  - apiGroups: [""]
    resources: ["pods", "pods/status", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # metrics.k8s.io pod usage for the workspace status page (metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}-workspaces
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dsh-control-plane.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "dsh-control-plane.fullname" . }}-workspaces
  apiGroup: rbac.authorization.k8s.io