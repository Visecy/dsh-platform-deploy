apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
    spec:
      serviceAccountName: {{ include "dsh-control-plane.fullname" . }}
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000
      initContainers:
        # ── plugin installer: pnpm-safe profile setup (dsh-web-auth fork +
        #    @visecy/dsh-auth-oidc in-process OIDC gate) ──────────────────────
        - name: plugin-install
          image: "{{ .Values.image.dshWeb }}"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -e
              export HOME=/home/node
              export DSH_HOME=/home/node/.dsh
              export PNPM_HOME=/tmp/pnpm
              export COREPACK_HOME=/tmp/corepack
              export XDG_DATA_HOME=/tmp/xdg
              P=/home/node/.dsh/profiles/web
              # first run initializes the profile (manifest + pnpm workspace root)
              dsh --profile web --dump-config > /dev/null 2>&1 || true
              # cat redirect (not cp): ConfigMap files are 0444; cp would inherit the
              # read-only mode and block re-runs of this init on CrashLoop/restart
              install_plugin() {
                local name="$1" file="$2" pkg="$3"
                mkdir -p "$P/node_modules/@visecy/$name"
                cat "/dsh-plugins/$file" > "$P/node_modules/@visecy/$name/index.js"
                cat "/dsh-plugins/$pkg" > "$P/node_modules/@visecy/$name/package.json"
              }
              install_plugin dsh-auth-oidc auth-oidc-plugin.js pkg-auth-oidc.json
              install_plugin dsh-fs-k8s fs-k8s.js pkg-fs-k8s.json
              install_plugin dsh-subprocess-k8s subprocess-k8s.js pkg-subprocess-k8s.json
              install_plugin dsh-workspace-k8s workspace-k8s.js pkg-workspace-k8s.json
              corepack pnpm --dir "$P" --store-dir /tmp/pnpm-store add -w dsh-web-auth@0.1.0 @kubernetes/client-node
              cat /dsh-plugins/cordis.patch.yml > "$P/cordis.patch.yml"

              # headless profile: same k8s providers (for one-shot tasks)
              H=/home/node/.dsh/profiles/headless
              dsh --profile headless --dump-config > /dev/null 2>&1 || true
              install_plugin2() {
                local name="$1" file="$2" pkg="$3"
                mkdir -p "$H/node_modules/@visecy/$name"
                cat "/dsh-plugins/$file" > "$H/node_modules/@visecy/$name/index.js"
                cat "/dsh-plugins/$pkg" > "$H/node_modules/@visecy/$name/package.json"
              }
              install_plugin2 dsh-fs-k8s fs-k8s.js pkg-fs-k8s.json
              install_plugin2 dsh-subprocess-k8s subprocess-k8s.js pkg-subprocess-k8s.json
              install_plugin2 dsh-workspace-k8s workspace-k8s.js pkg-workspace-k8s.json
              corepack pnpm --dir "$H" --store-dir /tmp/pnpm-store add -w @kubernetes/client-node
              cat > "$H/cordis.patch.yml" << 'PATCHEOF'
              - id: subprocess
                disabled: true
              - id: fs-sandbox
                disabled: true
              - insert:
                  - id: workspace-runtime
                    name: '@visecy/dsh-workspace-k8s'
                    config:
                      namespace: !!js process.env.WS_NAMESPACE ?? 'dsh-platform'
                      image: !!js process.env.WS_IMAGE ?? 'ghcr.io/visecy/dsh-sandbox-daemon:0.1.0'
                      daemonPort: 4390
                      storageClassName: !!js process.env.WS_STORAGE_CLASS ?? 'local-path'
                      storageSize: '2Gi'
                  - id: fs-k8s
                    name: '@visecy/dsh-fs-k8s'
                    config:
                      daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
                      hostRoot: '/workspaces'
                      podRoot: '/workspace'
                  - id: subprocess-k8s
                    name: '@visecy/dsh-subprocess-k8s'
                    config:
                      daemonEndpoint: !!js (process.env.WS_DAEMON_ENDPOINT ?? 'http://127.0.0.1:4390')
              PATCHEOF

              # ── privileged-method unlock: settings/credentials RPCs are pinned to
              #    loopback by the official client-connection (PRIVILEGED_METHODS
              #    passes an empty trust list). Our OIDC gate authenticates every /api
              #    request, so reusing the trusted hosts is safe (research §6.3c).
              # privileged-method unlock: copy the lib to a shared volume and patch
              # the copy; dsh-web mounts it over the official lib dir (rootfs RO).
              CCLIB=/usr/local/lib/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-client-connection/lib
              mkdir -p /patch
              cp -r "$CCLIB/." /patch/
              sed -i 's/isTrustedApiRequest(request, \[\])/isTrustedApiRequest(request, trustedHosts)/' /patch/index.js
              echo "privileged unlock: $(grep -c 'isTrustedApiRequest(request, trustedHosts)' /patch/index.js) line(s) patched"

              # init runs as root to patch /usr/local; hand the profile back to node
              chown -R 1000:1000 /home/node/.dsh
              echo "plugin install done (web + headless)"
          env:
            - name: DSH_TELEMETRY_DISABLED
              value: "1"
          volumeMounts:
            - name: dsh-home
              mountPath: /home/node/.dsh
            - name: dsh-tmp
              mountPath: /tmp
            - name: dsh-plugins
              mountPath: /dsh-plugins
            - name: dsh-cc-patch
              mountPath: /patch
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        # ── dsh web with in-process OIDC gate (no sidecar) ────────────────────
        - name: dsh-web
          image: "{{ .Values.image.dshWeb }}"
          imagePullPolicy: Always
          args:
            - web
            - --port
            - "{{ .Values.dshWeb.port }}"
            {{- range .Values.dshWeb.trustedHosts }}
            - --trusted-host
            - {{ . | quote }}
            {{- end }}
            {{- range .Values.dshWeb.trustedHosts }}
            - --trusted-host
            - {{ . | quote }}
            {{- end }}
          env:
            - name: DSH_TELEMETRY_DISABLED
              value: "1"
            - name: OIDC_ISSUER
              value: {{ .Values.auth.oidcIssuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidcClientId | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.auth.redirectUri | quote }}
            - name: ADMIN_GROUPS
              value: {{ .Values.auth.adminGroups | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.oidcClientSecretRef required" .Values.auth.oidcClientSecretRef }}
                  key: oidc-client-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.sessionSecretRef required" .Values.auth.sessionSecretRef }}
                  key: session-secret
          ports:
            - containerPort: {{ .Values.dshWeb.port }}
              name: dsh-web
          volumeMounts:
            - name: dsh-home
              mountPath: /home/node/.dsh
            - name: dsh-home
              mountPath: /workspace
            - name: dsh-tmp
              mountPath: /tmp
            - name: dsh-plugins
              mountPath: /dsh-plugins
            - name: dsh-cc-patch
              mountPath: /usr/local/lib/node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-client-connection/lib
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: dsh-home
          emptyDir: {}
        - name: dsh-tmp
          emptyDir: {}
        - name: dsh-cc-patch
          emptyDir: {}
        - name: dsh-plugins
          configMap:
            name: {{ include "dsh-control-plane.fullname" . }}-plugins
            defaultMode: 0444
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}