apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
    spec:
      serviceAccountName: {{ include "dsh-control-plane.fullname" . }}
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000
      containers:
        # ── dsh web platform image: self-contained (plugins + privileged
        #    patch baked in at /opt/dsh-home by the release pipeline).
        #    Runtime DSH_HOME must be writable (profile synthesis writes
        #    cordis.yml): override to the emptyDir volume and copy the
        #    baked-in home on start. ────────────────────────────────────────
        - name: dsh-web
          image: "{{ .Values.image.dshWeb }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -d /opt/dsh-home/profiles ]; then
                cp -r /opt/dsh-home/. /home/node/.dsh/
              fi
              exec dsh web --port "{{ .Values.dshWeb.port }}" \
                {{- range .Values.dshWeb.trustedHosts }}
                --trusted-host {{ . | quote }} \
                {{- end }}
          env:
            - name: DSH_HOME
              value: /home/node/.dsh
            - name: DSH_TELEMETRY_DISABLED
              value: "1"
            - name: OIDC_ISSUER
              value: {{ .Values.auth.oidcIssuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidcClientId | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.auth.redirectUri | quote }}
            - name: ADMIN_GROUPS
              value: {{ .Values.auth.adminGroups | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.oidcClientSecretRef required" .Values.auth.oidcClientSecretRef }}
                  key: oidc-client-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.sessionSecretRef required" .Values.auth.sessionSecretRef }}
                  key: session-secret
            - name: WS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: WS_IMAGE
              value: {{ .Values.workspace.image | quote }}
          ports:
            - containerPort: {{ .Values.dshWeb.port }}
              name: dsh-web
          volumeMounts:
            - name: dsh-home
              mountPath: /home/node/.dsh
            - name: dsh-tmp
              mountPath: /tmp
            - name: dsh-workspaces
              mountPath: /workspaces
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: dsh-home
          emptyDir: {}
        - name: dsh-tmp
          emptyDir: {}
        - name: dsh-workspaces
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
