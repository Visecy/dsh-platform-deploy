apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      initContainers:
        # ── plugin installer: pnpm-safe profile setup (dsh-web-auth fork +
        #    @visecy/dsh-auth-oidc in-process OIDC gate) ──────────────────────
        - name: plugin-install
          image: "{{ .Values.image.dshWeb }}"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -e
              export HOME=/home/node
              export DSH_HOME=/home/node/.dsh
              export PNPM_HOME=/tmp/pnpm
              export COREPACK_HOME=/tmp/corepack
              export XDG_DATA_HOME=/tmp/xdg
              P=/home/node/.dsh/profiles/web
              # first run initializes the profile (manifest + pnpm workspace root)
              dsh --profile web --dump-config > /dev/null 2>&1 || true
              mkdir -p "$P/node_modules/@visecy/dsh-auth-oidc"
              # cat redirect (not cp): ConfigMap files are 0444; cp would inherit the
              # read-only mode and block re-runs of this init on CrashLoop/restart
              cat /dsh-plugins/auth-oidc-plugin.js > "$P/node_modules/@visecy/dsh-auth-oidc/index.js"
              cat > "$P/node_modules/@visecy/dsh-auth-oidc/package.json" << 'EOF'
              {
                "name": "@visecy/dsh-auth-oidc",
                "version": "0.1.0",
                "type": "module",
                "main": "index.js",
                "exports": { ".": "./index.js" }
              }
              EOF
              corepack pnpm --dir "$P" --store-dir /tmp/pnpm-store add -w dsh-web-auth@0.1.0 @kubernetes/client-node
              cat /dsh-plugins/cordis.patch.yml > "$P/cordis.patch.yml"
              echo "plugin install done"
          env:
            - name: DSH_TELEMETRY_DISABLED
              value: "1"
          volumeMounts:
            - name: dsh-home
              mountPath: /home/node/.dsh
            - name: dsh-tmp
              mountPath: /tmp
            - name: dsh-plugins
              mountPath: /dsh-plugins
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        # ── dsh web with in-process OIDC gate (no sidecar) ────────────────────
        - name: dsh-web
          image: "{{ .Values.image.dshWeb }}"
          imagePullPolicy: Always
          args:
            - web
            - --port
            - "{{ .Values.dshWeb.port }}"
            {{- range .Values.dshWeb.trustedHosts }}
            - --trusted-host
            - {{ . | quote }}
            {{- end }}
          env:
            - name: DSH_TELEMETRY_DISABLED
              value: "1"
            - name: OIDC_ISSUER
              value: {{ .Values.auth.oidcIssuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidcClientId | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.auth.redirectUri | quote }}
            - name: ADMIN_GROUPS
              value: {{ .Values.auth.adminGroups | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.oidcClientSecretRef required" .Values.auth.oidcClientSecretRef }}
                  key: oidc-client-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.sessionSecretRef required" .Values.auth.sessionSecretRef }}
                  key: session-secret
          ports:
            - containerPort: {{ .Values.dshWeb.port }}
              name: dsh-web
          volumeMounts:
            - name: dsh-home
              mountPath: /home/node/.dsh
            - name: dsh-home
              mountPath: /workspace
            - name: dsh-tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: dsh-home
          emptyDir: {}
        - name: dsh-tmp
          emptyDir: {}
        - name: dsh-plugins
          configMap:
            name: {{ include "dsh-control-plane.fullname" . }}-plugins
            defaultMode: 0444
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}