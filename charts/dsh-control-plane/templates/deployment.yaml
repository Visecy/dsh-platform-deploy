apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
    spec:
      serviceAccountName: {{ include "dsh-control-plane.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      # Empty by default: the published images are public. Set it when mirroring
      # them into a private registry (values.yaml has the shape).
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        # Required by the `restricted` PodSecurity standard. RuntimeDefault is
        # the runtime's own profile, so this only changes the admission decision.
        seccompProfile:
          type: RuntimeDefault
      # ── public root: passed to `dsh web` as --public-url ────────────────
      # The public root is the deployment's single external-URL truth. It is
      # passed to the DSH process as `--public-url`, and the app advertises it
      # everywhere: the launch-token handoff redirect (identity-bridge reads the
      # official advertised root through ctx.webApp.getAdvertisedUrl()),
      # DSH_WEB_URL, and the runtime context. With no root configured the
      # handoff would derive it from the REQUEST's X-Forwarded-Proto/Host --
      # headers a client can influence unless oauth2Proxy.trustedProxyIps pins
      # the trusted proxy CIDR. The app's own authority fence (an unknown
      # authority never receives a tokenized Location) is the backstop, but
      # passing the root removes the reliance instead of stacking another guard.
      #
      # Requires a platform image on the DSH 0.2.1 line (v0.1.95+; earlier 0.2.1 tags
      # break the terminal or workspace lifecycle): that CLI
      # understands `--public-url`, and its identity-bridge derives the handoff
      # root from the same advertised URL. No DSH_PUBLIC_ORIGIN env is needed;
      # the profile keeps it only as an explicit override for hand-rolled
      # manifests.
      #
      # Resolution order (first hit wins):
      #   1. oauth2Proxy.publicOrigin            (explicit; recommended)
      #   2. origin of oauth2Proxy.redirectUrl   (the IdP callback URL)
      #   3. origin of auth.redirectUri          (same origin, older key)
      #   4. https://<ingress.host>   when ingress.enabled
      #   5. https://<istio.host>     when istio.enabled
      # Nothing derivable is a render error: never fall back to the request.
      {{- /* Shared derivation + validation: see _helpers.tpl. Root publishing
             ($mountPrefix == "") keeps the pre-subpath output byte for byte;
             a path in the public root switches on subpath publishing. */}}
      {{- $publicRoot := include "dsh-control-plane.publicRoot" . }}
      {{- $mountPrefix := include "dsh-control-plane.mountPrefix" . }}
      containers:
        # ── dsh web platform image: self-contained (plugins baked in at
        #    /opt/dsh-home by the release pipeline).
        #    Runtime DSH_HOME must be writable (profile synthesis writes
        #    cordis.yml): override to the emptyDir volume and copy the
        #    baked-in home on start.
        #
        #    --host 127.0.0.1 is this chart's half of the authentication
        #    design, not a preference: DSH trusts the identity headers it
        #    receives, so it must be unreachable except through the sidecar in
        #    this pod. The other half is the platform profile
        #    (dsh-platform repo, docker/profiles/web.cordis.patch.yml): the
        #    official webserver row binds loopback, and no Service targets this
        #    port. values.yaml pins the image tag for exactly this reason. ────
        - name: dsh-web
          image: "{{ .Values.image.dshWeb }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -d /opt/dsh-home/profiles ]; then
                cp -r /opt/dsh-home/. /home/node/.dsh/
              fi
              exec dsh web --host "127.0.0.1" --port "{{ .Values.dshWeb.port }}" \
                --public-url {{ required "cannot derive the deployment's public root: set oauth2Proxy.publicOrigin to https://<host>[/<prefix>] (no trailing slash), or set oauth2Proxy.redirectUrl / auth.redirectUri, or enable ingress/istio with a host" $publicRoot | quote }} \
                {{- range .Values.dshWeb.trustedHosts }}
                --trusted-host {{ . | quote }} \
                {{- end }}
          env:
            - name: DSH_HOME
              value: /home/node/.dsh
            - name: DSH_TELEMETRY_DISABLED
              value: "1"
            # No DSH_PUBLIC_ORIGIN: the public root travels as --public-url
            # above (the 0.2.1 advertised URL is the single origin truth). The
            # platform profile still accepts the env var as an explicit
            # identity-bridge override for hand-rolled manifests.
            # No OIDC_* / ADMIN_GROUPS / SESSION_SECRET here: the in-process
            # gate that read them is retired and the app consumes none of
            # them. The sidecar below reads its own OAUTH2_PROXY_* names, and
            # the auth.* values feed its args.
            - name: WS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: WS_IMAGE
              value: {{ required "workspace.image required: it must be the daemon image built from the same platform tag as image.dshWeb" .Values.workspace.image | quote }}
            # ── workspace runtime knobs ────────────────────────────────────
            # Every one of these is read by the platform image's profile
            # (docker/profiles/*.cordis.patch.yml in dsh-platform). They are
            # rendered as plain env so a deployment can change them without
            # rebuilding the image; the profile's own defaults are the fallback
            # for hand-rolled manifests.
            - name: WS_STORAGE_CLASS
              value: {{ .Values.workspace.storageClassName | quote }}
            - name: WS_STORAGE_SIZE
              value: {{ .Values.workspace.storageSize | quote }}
            - name: WS_RUNTIME_CLASS
              value: {{ .Values.workspace.runtimeClassName | quote }}
            - name: WS_IDLE_TIMEOUT_MS
              value: {{ .Values.workspace.idleTimeoutMs | quote }}
            - name: WS_GRACE_MS
              value: {{ .Values.workspace.graceMs | quote }}
            - name: WS_RECONCILE_INTERVAL_MS
              value: {{ .Values.workspace.reconcileIntervalMs | quote }}
            - name: WS_METRIC_INTERVAL_MS
              value: {{ .Values.workspace.metricIntervalMs | quote }}
            - name: WS_CPU_LIMIT
              value: {{ .Values.workspace.cpu | quote }}
            - name: WS_MEM_LIMIT
              value: {{ .Values.workspace.memory | quote }}
            {{- if .Values.workspace.networkPolicy.enabled }}
            # Fences the unauthenticated daemon (4390) to the control plane.
            # Requires a CNI that enforces NetworkPolicy; the peer labels must
            # match the pods that call the daemon (see values.yaml).
            - name: WS_NETWORK_POLICY
              value: "1"
            - name: WS_CONTROL_PLANE_POD_LABELS
              value: {{ .Values.workspace.networkPolicy.controlPlanePodLabels | toJson | quote }}
            {{- end }}
            - name: DSH_PG_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.db }}{{ .Values.db.connectionStringSecret | default "dsh-db" }}{{ else }}dsh-db{{ end }}
                  key: DSH_PG_CONNECTION_STRING
          ports:
            - containerPort: {{ .Values.dshWeb.port }}
              name: dsh-web
          volumeMounts:
            - name: dsh-home
              mountPath: /home/node/.dsh
            - name: dsh-tmp
              mountPath: /tmp
            - name: dsh-workspaces
              mountPath: /workspaces
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        # ── oauth2-proxy sidecar: the pod's only network entry point. It
        #    authenticates the user against the existing OIDC application
        #    (cookie session -- stateless, nothing to persist) and proxies to
        #    the loopback-bound container above. No volume: it must never be
        #    able to write state to disk. ───────────────────────────────────
        {{- $cookieSecretRef := .Values.oauth2Proxy.cookieSecretRef | default .Values.auth.sessionSecretRef }}
        {{- $redirectUrl := .Values.oauth2Proxy.redirectUrl }}
        {{- if not $redirectUrl }}
        {{- if $mountPrefix }}
        {{- /* Subpath publishing: the IdP callback must live under the prefix
               (the ingress/gateway strips the prefix again before the sidecar).
               Root publishing keeps the origin-era derivation unchanged. */}}
        {{- $redirectUrl = printf "%s/oauth2/callback" $publicRoot }}
        {{- else }}
        {{- $parsed := urlParse .Values.auth.redirectUri }}
        {{- if and $parsed.scheme $parsed.host }}
        {{- $redirectUrl = printf "%s://%s/oauth2/callback" $parsed.scheme $parsed.host }}
        {{- end }}
        {{- end }}
        {{- end }}
        - name: oauth2-proxy
          image: "{{ .Values.oauth2Proxy.image }}:{{ .Values.oauth2Proxy.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            # -- identity
            - --provider=oidc
            - --oidc-issuer-url={{ required "auth.oidcIssuer required" .Values.auth.oidcIssuer }}
            - --client-id={{ required "auth.oidcClientId required" .Values.auth.oidcClientId }}
            - --scope={{ .Values.oauth2Proxy.scope }}
            - --oidc-groups-claim={{ .Values.oauth2Proxy.groupsClaim }}
            # the IdP application assignment is the authorization boundary
            - --email-domain=*
            # single-provider deployment: skip the interstitial sign-in page
            # and redirect straight to the IdP
            - --skip-provider-button=true
            # stateless session: the whole session lives in the cookie
            - --session-store-type=cookie
            # -- upstream (no path -> route "/" -> every request)
            - --upstream=http://127.0.0.1:{{ .Values.dshWeb.port }}
            # Identity headers. TRUSTED UPSTREAM PAIR: X-Forwarded-User /
            # X-Forwarded-Groups. --pass-user-headers (default true, pinned
            # here) is what makes the upstream identity work: oauth2-proxy
            # strips any client-supplied copy of those names and then injects
            # the session's verified principal as X-Forwarded-User,
            # X-Forwarded-Groups, X-Forwarded-Email and
            # X-Forwarded-Preferred-Username REQUEST headers. identity-bridge
            # reads exactly X-Forwarded-User / X-Forwarded-Groups (see
            # docs/deployment.md).
            #
            # X-Auth-Request-* is NOT identity in this topology: it is
            # client-controllable and must never be read as one. MEASURED
            # against v7.15.5 (probe: .dshcmp/tmp/header_probe.sh):
            # client-supplied X-Auth-Request-User/-Groups/-Email reach the
            # upstream unchanged -- oauth2-proxy only strips the headers it
            # injects as REQUEST headers, and that family is wired as RESPONSE
            # headers, so it is never in the strip list.
            #
            # --set-xauthrequest is deliberately NOT set. It only adds that
            # family to the browser RESPONSE, nothing in this deployment
            # consumes it, and switching it on invites a future reader to treat
            # those names as trustworthy -- a real spoofing hole if anything
            # behind this proxy ever read them. Dropping it is security-neutral
            # for the X-Forwarded-* passthrough (measured: identical upstream
            # headers with the flag on and off); the flags here are the ones
            # that carry the identity.
            #
            # HARDENING (comment only, intentionally not implemented): if a
            # future component ever does need to consume X-Auth-Request-*, the
            # available defence in depth is an ingress-level strip of those
            # request headers (e.g. an nginx configuration-snippet); in
            # legacy-option mode this chart cannot remove them itself.
            - --pass-user-headers=true
            # dsh web's /api Host/Origin fence validates the Host header, so
            # the original Host must survive this hop (default, pinned here
            # because it is load-bearing).
            - --pass-host-header=true
            # trust X-Forwarded-Proto/Host from the ingress/gateway
            - --reverse-proxy=true
            - --http-address=0.0.0.0:{{ .Values.oauth2Proxy.port }}
            {{- with $redirectUrl }}
            - --redirect-url={{ . }}
            {{- end }}
            {{- if $mountPrefix }}
            {{- /* Narrow the sidecar session cookie to the mount point so it is
                   not sent to other services on the same host. Root publishing
                   keeps the sidecar default (Path=/), i.e. no flag. The DSH
                   app cookie is authority-scoped with Path=/ and is untouched
                   by upstream design -- see docs/deployment.md §4.4. */}}
            - --cookie-path={{ $mountPrefix }}/
            {{- end }}
            # -- long-lived connections: /api/remote.mux (WebSocket) and
            # /plugins/events (SSE) must not be buffered or cut. FlushInterval
            # is the streaming flush period and upstream-timeout is a
            # response-header timeout (not a whole-request timeout), so a
            # generous value is safe for streams and covers a cold upstream.
            - --flush-interval=1s
            - --upstream-timeout=1h
            - --silence-ping-logging=true
            {{- range .Values.oauth2Proxy.trustedProxyIps }}
            - --trusted-proxy-ip={{ . }}
            {{- end }}
            {{- range .Values.oauth2Proxy.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Secrets are supplied through oauth2-proxy's documented
            # OAUTH2_PROXY_* environment mapping (equivalent to
            # --client-secret / --cookie-secret) so that no secret value ever
            # appears in the pod spec's args. The cookie secret must decode to
            # exactly 16, 24 or 32 bytes.
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.oidcClientSecretRef required" .Values.auth.oidcClientSecretRef }}
                  key: oidc-client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "oauth2Proxy.cookieSecretRef or auth.sessionSecretRef required" $cookieSecretRef }}
                  key: {{ .Values.oauth2Proxy.cookieSecretKey }}
          ports:
            - containerPort: {{ .Values.oauth2Proxy.port }}
              name: http
          # /ping is served from oauth2-proxy's pre-auth chain, so probes do
          # not need a session.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            # 65532 is the USER declared by the pinned upstream image; setting
            # it explicitly keeps runAsNonRoot verifiable for variant tags
            # (e.g. -alpine) that declare no numeric user.
            runAsUser: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
      volumes:
        - name: dsh-home
          emptyDir: {}
        - name: dsh-tmp
          emptyDir: {}
        - name: dsh-workspaces
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
