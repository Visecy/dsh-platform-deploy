apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
  policyTypes: [Ingress]
  ingress:
    # dsh web (3080) is reachable from the cluster (ingress/port-forward);
    # no other ports are exposed.
    - ports:
        - protocol: TCP
          port: 3080
