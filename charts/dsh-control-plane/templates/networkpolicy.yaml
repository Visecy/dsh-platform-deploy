apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dsh-control-plane.fullname" . }}
  labels:
    {{- include "dsh-control-plane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
  policyTypes: [Ingress]
  ingress:
    # oauth2-proxy ({{ .Values.oauth2Proxy.port }}) is the pod's entry point and stays reachable
    # from the cluster (ingress controller / internal gateway / port-forward),
    # exactly as the old dsh web port was.
    - ports:
        - protocol: TCP
          port: {{ .Values.oauth2Proxy.port }}
    # dsh web ({{ .Values.dshWeb.port }}) is meant to be reachable only from this pod. Normal
    # sidecar traffic goes over 127.0.0.1 inside the pod netns, which
    # NetworkPolicy never evaluates; this rule covers the remaining path -- a
    # connection to the pod IP -- and allows it only from pods carrying this
    # workload's own labels. What this rule is and is not:
    #   * until the deployed control-plane image is built from the platform
    #     profile that drops the `webserver-gated` fork row (which hardcodes
    #     `host: '0.0.0.0'`), dsh web listens on the pod IP too and THIS RULE IS
    #     THE ONLY BARRIER on that path. Once such an image is in use the process
    #     binds loopback and this rule is defence in depth (see values.yaml);
    #   * it is enforced only by a policy-capable CNI: with a CNI that ignores
    #     NetworkPolicy, nothing here applies;
    #   * the peer is a label selector, not "this pod" -- the NetworkPolicy API
    #     has no "same pod" peer type, so with replicaCount > 1 it also admits
    #     sibling replicas. replicaCount 1 is what makes it exact today.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "dsh-control-plane.name" . }}
      ports:
        - protocol: TCP
          port: {{ .Values.dshWeb.port }}
