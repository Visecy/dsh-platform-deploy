# Workspace runtime smoke test: replicates the pod spec generated by
# dsh-workspace-k8s K8sPodController.ensurePod (emptyDir variant),
# so we can verify the sandbox daemon image + API in-cluster.
apiVersion: v1
kind: Pod
metadata:
  name: dsh-ws-smoke
  namespace: dsh-platform
  labels:
    app: dsh-workspace
    workspace: dsh-ws-smoke
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containers:
    - name: sandbox-daemon
      image: ghcr.io/visecy/dsh-sandbox-daemon:0.1.0
      imagePullPolicy: Always
      ports:
        - containerPort: 4390
          name: daemon
      readinessProbe:
        httpGet:
          path: /healthz
          port: 4390
        initialDelaySeconds: 1
        periodSeconds: 2
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      env:
        - name: DAEMON_ROOT
          value: /workspace
        - name: DAEMON_PORT
          value: "4390"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      emptyDir: {}
---
# headless service, same as K8sPodController.ensurePod
apiVersion: v1
kind: Service
metadata:
  name: dsh-ws-smoke-svc
  namespace: dsh-platform
  labels:
    app: dsh-workspace
    workspace: dsh-ws-smoke
spec:
  clusterIP: None
  selector:
    app: dsh-workspace
    workspace: dsh-ws-smoke
  ports:
    - port: 4390
      targetPort: 4390
      name: daemon
