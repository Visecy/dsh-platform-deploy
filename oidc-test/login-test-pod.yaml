apiVersion: v1
kind: Pod
metadata:
  name: login-test
  namespace: dsh-oidc-test
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: node:24-slim
      command: ["sh", "-c", "node /test/login-test.mjs"]
      volumeMounts:
        - name: script
          mountPath: /test
  volumes:
    - name: script
      configMap:
        name: login-test
