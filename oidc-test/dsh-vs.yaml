apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: dsh-control-plane
  namespace: dsh-platform
spec:
  gateways:
    - istio-system/internal-gateway
  hosts:
    - dsh.svc.visecy.top
  http:
    - route:
        - destination:
            host: dsh-control-plane-dsh-control-plane.dsh-platform.svc.cluster.local
            port:
              # the chart's Service publishes only the oauth2-proxy sidecar
              # port (4180); 3080 no longer exists, so the old value failed
              # closed with 503
              number: 4180
